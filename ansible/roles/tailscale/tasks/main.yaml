- name: Set tailscaled's firewall mode
  become: true
  ansible.builtin.lineinfile:
    path: /etc/default/tailscaled
    regexp: '^TS_DEBUG_FIREWALL_MODE='
    line: "TS_DEBUG_FIREWALL_MODE={{ tailscale_firewall_mode }}"
  when: tailscale_firewall_mode | length > 0
  notify: Restart tailscaled

# Tailscale's docs have subnet routers and exit nodes set these; this adopts the file they name.
- name: Enable forwarding for subnet routes and the exit node
  become: true
  ansible.posix.sysctl:
    name: "{{ item }}"
    value: '1'
    sysctl_file: /etc/sysctl.d/99-tailscale.conf
  loop: [net.ipv4.ip_forward, net.ipv6.conf.all.forwarding]

# Config holds the node's private keys; they are dropped on the host so they never reach a log.
- name: Read Tailscale prefs
  ansible.builtin.shell: >-
    tailscale debug prefs | python3 -c 'import json, sys; p = json.load(sys.stdin);
    [p.pop(k, None) for k in ("Config", "Persist")]; print(json.dumps(p))'
  register: tailscale_prefs
  changed_when: false
  check_mode: false

- name: Compare prefs with the desired state
  ansible.builtin.set_fact:
    tailscale_actual: "{{ tailscale_prefs.stdout | from_json }}"

- name: Report drift
  ansible.builtin.debug:
    msg:
      actual: "{{ tailscale_actual_view }}"
      desired: "{{ tailscale_desired_view }}"
  when: tailscale_drift | bool
  changed_when: true

# --reset returns every unspecified setting to its default, so this is the complete desired state.
- name: Apply Tailscale settings
  become: true
  ansible.builtin.command: >-
    tailscale up --reset --timeout=30s
    --advertise-routes={{ tailscale_advertise_routes | join(',') }}
    --advertise-exit-node={{ tailscale_exit_node | lower }}
    --ssh={{ tailscale_ssh | lower }}
    --accept-dns={{ tailscale_accept_dns | lower }}
  when: tailscale_drift | bool

- name: Keep auto-updates on
  become: true
  ansible.builtin.command: tailscale set --auto-update=true
  when: tailscale_drift | bool
