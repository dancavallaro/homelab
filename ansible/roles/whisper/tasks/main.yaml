- name: Create render group
  ansible.builtin.group:
    name: render
    gid: "{{ render_gid }}"
    system: true

- name: Create whisper group
  ansible.builtin.group:
    name: whisper
    gid: "{{ llama_gid }}"
    system: true

- name: Create whisper user
  ansible.builtin.user:
    name: whisper
    uid: "{{ llama_uid }}"
    group: whisper
    groups: render
    system: true
    home: /var/lib/whisper
    shell: /usr/sbin/nologin

- name: Install apt packages
  become: true
  ansible.builtin.apt:
    update_cache: yes
    pkg:
      - vim
      - curl
      - git
      - ffmpeg
      - build-essential
      - cmake
      - glslc
      - spirv-headers
      - libvulkan-dev
      - mesa-vulkan-drivers
      - vulkan-tools
      - python3-venv
      - python3-dev
      - python3-pip

- name: Set default editor
  become: true
  community.general.alternatives:
    name: editor
    path: /usr/bin/vim.basic

