- name: Create alloy user
  become: true
  ansible.builtin.user:
    name: alloy
    system: true
    shell: /usr/sbin/nologin
    home: /var/lib/alloy
    create_home: false

- name: Download Alloy
  become: true
  notify: Restart alloy
  ansible.builtin.get_url:
    url: "https://github.com/dancavallaro/alloy/releases/download/{{ alloy_version }}/alloy-linux-{{ arch }}"
    dest: /usr/local/bin/alloy
    checksum: "sha256:{{ alloy_sha256 }}"
    mode: '0755'

- name: Create Alloy config directory
  become: true
  ansible.builtin.file:
    path: /etc/alloy
    state: directory
    mode: '0755'

- name: Install Alloy config
  become: true
  notify: Restart alloy
  ansible.builtin.copy:
    src: config.alloy
    dest: /etc/alloy/config.alloy
    mode: '0644'

- name: Install Alloy unit
  become: true
  notify: Restart alloy
  ansible.builtin.copy:
    src: alloy.service
    dest: /etc/systemd/system/alloy.service
    mode: '0644'

- name: Enable and start Alloy
  become: true
  ansible.builtin.systemd_service:
    name: alloy
    enabled: true
    state: started
    daemon_reload: true
