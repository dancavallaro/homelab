- name: Create spirl user
  become: true
  ansible.builtin.user:
    name: spirl
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    groups: tss
    append: true

- name: Create spirl config directory
  become: true
  ansible.builtin.file:
    path: /etc/spirl
    state: directory
    mode: '0755'

- name: Render spirl-agent config
  become: true
  notify: Restart spirl-agent
  ansible.builtin.template:
    src: agent-config.yaml.j2
    dest: /etc/spirl/agent-config.yaml
    mode: '0644'

- name: Create spirl-agent drop-in directory
  become: true
  ansible.builtin.file:
    path: /etc/systemd/system/spirl-agent.service.d
    state: directory
    mode: '0755'

- name: Install spirl-agent drop-in
  become: true
  notify: Restart spirl-agent
  register: spirl_agent_dropin
  ansible.builtin.copy:
    src: spirl-agent.conf
    dest: /etc/systemd/system/spirl-agent.service.d/homelab.conf
    mode: '0644'

# The package's postinst starts the unit, so the drop-in must be loaded first.
- name: Reload systemd
  become: true
  when: spirl_agent_dropin.changed
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Download spirl-agent package
  become: true
  ansible.builtin.get_url:
    url: "https://spirl-releases.s3.us-west-2.amazonaws.com/spirl-agent/{{ spirl_agent_version }}/spirl-agent_{{ spirl_agent_version }}_linux_{{ arch }}.deb"
    dest: "/var/cache/spirl-agent_{{ spirl_agent_version }}_linux_{{ arch }}.deb"
    checksum: "sha256:{{ spirl_agent_deb_sha256 }}"
    mode: '0644'

- name: Install spirl-agent package
  become: true
  notify: Restart spirl-agent
  ansible.builtin.apt:
    deb: "/var/cache/spirl-agent_{{ spirl_agent_version }}_linux_{{ arch }}.deb"

- name: Enable and start spirl-agent
  become: true
  ansible.builtin.systemd_service:
    name: spirl-agent
    enabled: true
    state: started
