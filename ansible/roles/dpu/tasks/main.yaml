- name: Install apt packages
  become: true
  ansible.builtin.apt:
    update_cache: true
    pkg:
      - rsyslog
      # Creates the tss group and the udev rule that lets it open /dev/tpmrm0.
      - tpm-udev
      - tpm2-tools

# Its rules repeat the logging role's rsyslog.conf, so every local line would be written twice.
- name: Remove Ubuntu's default rsyslog rules
  become: true
  notify: Restart rsyslog
  ansible.builtin.file:
    path: /etc/rsyslog.d/50-default.conf
    state: absent

- name: Install spirl-agent
  ansible.builtin.import_tasks: spirl-agent.yaml

- name: Install Alloy
  ansible.builtin.import_tasks: alloy.yaml
