# Run the packaged unit as non-root; tss grants /dev/tpmrm0, and the socket lives in /run/spirl.
[Service]
User=spirl
Group=spirl
SupplementaryGroups=tss
RuntimeDirectory=spirl
RuntimeDirectoryMode=0755
# http_dns refuses ports above 1024.
AmbientCapabilities=CAP_NET_BIND_SERVICE
CapabilityBoundingSet=CAP_NET_BIND_SERVICE
NoNewPrivileges=yes
Restart=on-failure
