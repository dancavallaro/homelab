- name: Bootstrap host
  hosts: cattle
  pre_tasks:
    - name: Sanity check
      tags:
        - ping
      ansible.builtin.ping:
  roles:
    - {role: common, tags: common}
    - {role: users, tags: users}
    - {role: docker, tags: docker}
    - {role: logging, tags: logging}
    - {role: tailscale, tags: tailscale}
    - {role: ups, tags: ups, when: monitor_ups}
    - {role: raspberry_pi, tags: raspberry_pi, when: raspberry_pi}
    - {role: console, tags: console, when: enable_console}
    - {role: protectli, tags: protectli, when: inventory_hostname == 'protectli.lan'}
    - {role: talos_host, tags: talos_host, when: inventory_hostname == 'talos-host.lan'}

# Proxmox hosts and their guests get only the roles listed here, none of the defaults above.
- name: Configure Proxmox host
  hosts: proxmox
  roles:
    - {role: proxmox, tags: proxmox}

- name: Configure inference containers
  hosts: inference_vms
  gather_facts: false
  pre_tasks:
    - name: Wait for the container to boot
      tags: always
      ansible.builtin.wait_for_connection:
        timeout: 120
  roles:
    - {role: llama, tags: llama}

- name: Configure BlueField-3 DPU
  hosts: dpu
  roles:
    - {role: dpu, tags: dpu}
    - {role: logging, tags: logging}
