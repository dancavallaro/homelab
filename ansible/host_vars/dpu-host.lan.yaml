proxmox_models_size: 200g

# `options` are applied with `pct set` whenever they drift, so write them the way `pct config` prints them.
proxmox_lxcs:
  - vmid: 101
    template: local:vztmpl/ubuntu-24.04-standard_24.04-2_amd64.tar.zst
    rootfs: local-lvm:32
    options:
      hostname: cletus
      ostype: ubuntu
      unprivileged: 1
      cores: 6
      memory: 16384
      swap: 0
      features: nesting=1
      onboot: 1
      net0: name=eth0,bridge=vmbr0,firewall=1,hwaddr=BC:24:11:71:96:44,ip=dhcp,tag=4,type=veth
      dev0: /dev/dri/renderD128,gid={{ render_gid }}
      mp0: "{{ shared_models_dir }},mp={{ shared_models_dir }}"
