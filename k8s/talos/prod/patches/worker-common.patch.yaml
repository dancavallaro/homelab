machine:
  disks:
    - device: /dev/vdb
      partitions:
        - mountpoint: /var/mnt/data
  kubelet:
    # Evict pods to other nodes before the Talos OOM controller starts SIGKILLing them in place.
    extraConfig:
      evictionSoft:
        memory.available: 500Mi
      evictionSoftGracePeriod:
        memory.available: 1m
      evictionMaxPodGracePeriod: 60
    extraMounts:
      - source: /var/mnt/data
        destination: /var/mnt/data
        type: bind
        options:
          - bind
          - rshared
          - rw
  network:
    interfaces:
      # Home-network leg for pods' macvlan interfaces; the node itself holds no address on it.
      - deviceSelector:
          hardwareAddr: '02:d7:c0:00:0b:*'
          physical: true
        dhcp: false
  sysctls:
    net.ipv6.conf.enp9s0.disable_ipv6: "1"
