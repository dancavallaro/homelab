machine:
  install:
    disk: /dev/vda
    image: ghcr.io/dancavallaro/talos/installer:v1.13.9-bluetooth-iscsi # Custom build with BT modules/firmware and iSCSI support
    extraKernelArgs:
      - talos.logging.kernel=tcp://127.0.0.1:32412/
  network:
    nameservers:
      # The MikroTik on the cluster VLAN; it forwards *.o.cavnet.cloud and serves *.lan, which
      # CoreDNS and the apiserver both need.
      - 10.11.0.1
  kubelet:
    nodeIP:
      validSubnets:
        - 10.11.0.0/24
  features:
    nodeAddressSortAlgorithm: v2
  logging:
    destinations:
      - endpoint: "tcp://127.0.0.1:32411/"
        format: "json_lines"
# Use Cilium as CNI and kube-proxy replacement
cluster:
  network:
    cni:
      name: none
  proxy:
    disabled: true
