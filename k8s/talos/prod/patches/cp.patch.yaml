machine:
  certSANs:
    - k8s.cavnet.cloud
  features:
    # Enable Talos API access for the cluster backup job
    kubernetesTalosAPIAccess:
      enabled: true
      allowedRoles:
        - os:reader
        - os:operator
        - os:admin
      allowedKubernetesNamespaces:
        - default
        - cluster-archiver
  network:
    interfaces:
      - deviceSelector:
          hardwareAddr: '02:7f:50:1e:b0:55'
        dhcp: false
        addresses:
          - 10.42.42.100/16
        routes:
          - network: 10.42.0.0/16
          # Add a high-priority default route towards the Mikrotik, so return traffic
          # (from external inbound traffic) takes the same path instead of trying to
          # egress through the NATed 192.168.42.0/24 private network.
          - network: 0.0.0.0/0
            gateway: 10.42.42.1
            metric: 1
cluster:
  apiServer:
    admissionControl:
      - name: PodSecurity
        configuration:
          defaults:
            warn: baseline
    certSANs:
      - k8s.cavnet.cloud
    extraArgs:
      # Allow PocketID identities to auth to apiserver.
      oidc-issuer-url: https://pocket-id.o.cavnet.cloud
      oidc-client-id: 816acb21-3d87-470c-8d90-8c17ee9da65c
      oidc-groups-claim: groups
      oidc-username-claim: email
      # Publish a public OIDC issuer for AWS IAM web-identity federation (see
      # k8s/manifests/oidc-provider). The issuer + jwks-uri must exactly match
      # what oidc.cavnet.io serves and the AWS IAM OIDC provider URL.
      service-account-issuer: https://oidc.cavnet.io
      service-account-jwks-uri: https://oidc.cavnet.io/openid/v1/jwks
  controlPlane:
    endpoint: https://k8s.cavnet.cloud:6443
  etcd:
    advertisedSubnets:
      - 192.168.42.0/24
