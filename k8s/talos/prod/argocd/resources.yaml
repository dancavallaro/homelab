apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-repo-config
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-parameter-store
  target:
    template:
      engineVersion: v2
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repo-creds
      data:
        type: git
        url: https://github.com/dancavallaro
        username: "{{ .username }}"
        password: "{{ .password }}"
  dataFrom:
    - extract:
        key: /talos-prod/argocd/github-repo-config
