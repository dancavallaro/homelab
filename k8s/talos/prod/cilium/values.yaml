operator:
  replicas: 1
ipam:
  mode: kubernetes
kubeProxyReplacement: true
securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup
k8sServiceHost: localhost
k8sServicePort: 7445
l2announcements:
  enabled: true
# L2 announcement leases renew every 5s per LoadBalancer service; the default 5 QPS is shared with everything else.
k8sClientRateLimit:
  qps: 10
  burst: 20
ingressController:
  enabled: true
  default: true
  loadbalancerMode: dedicated
  defaultSecretNamespace: default
  defaultSecretName: any.o.cavnet.cloud-cert
gatewayAPI:
  enabled: true
  enableAlpn: true
hubble:
  relay:
    enabled: true
  ui:
    enabled: true
  tls:
    auto:
      enabled: true
      method: cronJob
      certValidityDuration: 365
      schedule: "0 0 1 */4 *" # re-issue every 4 months, well before expiry
bpf:
  lbExternalClusterIP: false
