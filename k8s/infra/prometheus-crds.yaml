apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  namespace: argocd
  name: prometheus-crds
spec:
  project: default
  source:
    repoURL: https://github.com/dancavallaro/homelab
    targetRevision: HEAD
    path: k8s/manifests/prometheus-crds
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - ServerSideApply=true
