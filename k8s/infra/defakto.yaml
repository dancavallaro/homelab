apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  namespace: argocd
  name: defakto
spec:
  project: default
  source:
    repoURL: https://github.com/dancavallaro/rpi-config
    targetRevision: HEAD
    path: k8s/manifests/defakto
  destination:
    server: https://kubernetes.default.svc
    namespace: tdd-kwtfbnrvlf
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
