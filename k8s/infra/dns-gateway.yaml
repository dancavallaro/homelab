apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  namespace: argocd
  name: dns-gateway
spec:
  project: default
  sources:
    - repoURL: https://github.com/dancavallaro/homelab
      path: k8s/manifests/k8s_gateway/chart
      targetRevision: HEAD
      helm:
        valueFiles:
          - $values/k8s/manifests/k8s_gateway/values.yaml
    - repoURL: https://github.com/dancavallaro/homelab
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: dns-gateway
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
