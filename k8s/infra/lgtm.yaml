apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  namespace: argocd
  name: monitoring-stack
spec:
  project: default
  source:
    repoURL: https://github.com/dancavallaro/homelab
    targetRevision: HEAD
    path: k8s/manifests/monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    # The PrometheusRules here need the CRDs from the prometheus-crds app, which may sync later.
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
