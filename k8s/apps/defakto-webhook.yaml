apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  namespace: argocd
  name: defakto-webhook
spec:
  project: default
  source:
    repoURL: https://github.com/dancavallaro/homelab
    targetRevision: HEAD
    path: k8s/manifests/defakto-webhook
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
