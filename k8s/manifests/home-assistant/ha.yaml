apiVersion: v1
kind: Namespace
metadata:
  name: hass
  labels:
    pod-security.kubernetes.io/enforce: privileged
  annotations:
    # Before the home NetworkAttachmentDefinition, which is wave -1.
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  namespace: hass
  name: hass-data
spec:
  storageClassName: synology-iscsi
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  namespace: hass
  name: hass
spec:
  selector:
    app: hass
  ports:
    - port: 80
      targetPort: 8123
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  namespace: hass
  name: hass
spec:
  serviceName: hass
  selector:
    matchLabels:
      app: hass
  replicas: 1
  revisionHistoryLimit: 0
  template:
    metadata:
      labels:
        app: hass
      annotations:
        k8s.v1.cni.cncf.io/networks: home
    spec:
      initContainers:
        - name: init-config
          image: alpine:3
          command:
            - sh
            - -c
          args:
            - cp /config-tmp/* /config/
          volumeMounts:
            - mountPath: /config
              name: hass-data
            - mountPath: /config-tmp
              name: hass-config
      containers:
        - name: hass
          image: homeassistant/home-assistant:2026.6.4
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
          volumeMounts:
            - mountPath: /config
              name: hass-data
          ports:
            - containerPort: 8123
          resources:
            requests:
              cpu: 100m
              memory: 640Mi
      volumes:
        - name: hass-data
          persistentVolumeClaim:
            claimName: hass-data
        - name: hass-config
          configMap:
            name: hass-config
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  namespace: hass
  name: hass
spec:
  parentRefs:
    - namespace: default
      name: private-gateway
      sectionName: websecure
  hostnames:
    - ha.o.cavnet.cloud
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: hass
          port: 80
