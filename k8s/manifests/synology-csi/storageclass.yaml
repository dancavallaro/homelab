apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  namespace: synology-csi
  name: client-info-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-parameter-store
  target:
    template:
      engineVersion: v2
      data:
        client-info.yaml: |
          clients:
            - host: dsm-data.synology-csi
              port: 5000
              https: false
              username: "{{ .username }}"
              password: "{{ .password }}"
  dataFrom:
    - extract:
        key: /talos-prod/synology-csi-user
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: synology-iscsi
provisioner: csi.san.synology.com
parameters:
  location: "/volume1"
  protocol: iscsi
  csi.storage.k8s.io/fstype: ext4
reclaimPolicy: Delete
allowVolumeExpansion: true
---
# Same as synology-iscsi, but the LUN survives deletion of its PVC. For volumes
# whose loss would be costly (e.g. RustFS, which holds every bucket).
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: synology-iscsi-retain
provisioner: csi.san.synology.com
parameters:
  location: "/volume1"
  protocol: iscsi
  csi.storage.k8s.io/fstype: ext4
reclaimPolicy: Retain
allowVolumeExpansion: true
---
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshotClass
metadata:
  name: synology-iscsi-snapshot
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
driver: csi.san.synology.com
deletionPolicy: Delete
parameters:
  description: "Kubernetes CSI"
  is_locked: "false"
