apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ledger-auth.yaml
helmCharts:
  - name: spirl-system
    repo: oci://ghcr.io/spirl/charts
    version: 0.44.0
    releaseName: spirl-system
    namespace: spirl-system
    # Both charts ship the same data.spirl.com CRD; the defakto-server app owns it.
    includeCRDs: false
    valuesInline:
      argocd:
        enabled: true
      agent:
        endpoint:
          endpoint: defakto.o.cavnet.cloud:443
        auth:
          attestors:
            - type: k8s_token
          clusterName: talos-prod
      telemetry:
        enabled: true
      ledger:
        enabled: true
        ingest:
          endpoint: ledger.edge.defakto.security:443
        id: sc-98lvlelq6p
        auth:
          suppliedSecretName: ledger-scanner-key
# The chart has no resources values for these DaemonSets.
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: DaemonSet
      metadata:
        name: spirl-agent
        namespace: spirl-system
      spec:
        template:
          spec:
            containers:
              - name: spirl-agent
                resources:
                  requests:
                    memory: 32Mi
  - patch: |-
      apiVersion: apps/v1
      kind: DaemonSet
      metadata:
        name: spiffe-csi-driver
        namespace: spirl-system
      spec:
        template:
          spec:
            containers:
              - name: spiffe-csi-driver
                resources:
                  requests:
                    memory: 32Mi
