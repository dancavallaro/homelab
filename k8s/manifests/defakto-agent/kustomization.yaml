apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
helmCharts:
  - name: spirl-system
    repo: oci://ghcr.io/spirl/charts
    version: 0.44.0
    releaseName: spirl-system
    namespace: spirl-system
    # Both charts ship the same data.spirl.com CRD; the defakto-server app owns it.
    includeCRDs: false
    valuesInline:
      argocd:
        enabled: true
      agent:
        endpoint:
          endpoint: defakto.o.cavnet.cloud:443
        auth:
          attestors:
            - type: k8s_token
          clusterName: talos-prod
