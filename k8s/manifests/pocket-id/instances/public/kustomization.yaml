apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pocket-id-public
resources:
  - ../../base
  - resources.yaml
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: pocket-id
      spec:
        template:
          spec:
            containers:
              - name: pocket-id
                env:
                  - name: APP_URL
                    value: https://id.cavnet.io
  - patch: |-
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: /talos-prod/pocket-id-public-encryption-key
    target:
      kind: ExternalSecret
  - patch: |-
      - op: replace
        path: /spec/parentRefs/0
        value:
          namespace: internet
          name: public-gateway
          sectionName: webpublic
      - op: replace
        path: /spec/hostnames/0
        value: id.cavnet.io
    target:
      kind: HTTPRoute
