apiVersion: v1
kind: Namespace
metadata:
  name: pocket-id
---
# Bound to the group claim from this instance only: it is the issuer the
# apiserver trusts (talos/prod/patches/oidc.patch.yaml), and the internet-facing
# instance must never grant cluster access.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pocketid-superusers-binding
subjects:
  - kind: Group
    name: superusers # Pocket ID group
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
