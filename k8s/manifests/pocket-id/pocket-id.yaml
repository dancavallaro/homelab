apiVersion: v1
kind: Namespace
metadata:
  name: pocket-id
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pocket-id-encryption-key
  namespace: pocket-id
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-parameter-store
  data:
    - secretKey: ENCRYPTION_KEY
      remoteRef:
        key: /talos-prod/pocket-id-encryption-key
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  namespace: pocket-id
  name: pocket-id-data
spec:
  storageClassName: synology-iscsi
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: pocket-id
  name: pocket-id
spec:
  replicas: 1
  revisionHistoryLimit: 0
  # RWO volume on synology-iscsi: the old pod must release the volume before
  # the new one can attach it, so replace in place instead of surging.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pocket-id
  template:
    metadata:
      labels:
        app: pocket-id
    spec:
      containers:
        - name: pocket-id
          image: ghcr.io/pocket-id/pocket-id:v2.14.0
          env:
            - name: APP_URL
              value: https://pocket-id.o.cavnet.cloud
            - name: TRUST_PROXY
              value: "true"
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: pocket-id-encryption-key
                  key: ENCRYPTION_KEY
          ports:
            - containerPort: 1411
          volumeMounts:
            - name: pocket-id-data
              mountPath: /app/data
      volumes:
        - name: pocket-id-data
          persistentVolumeClaim:
            claimName: pocket-id-data
---
apiVersion: v1
kind: Service
metadata:
  namespace: pocket-id
  name: pocket-id
spec:
  selector:
    app: pocket-id
  ports:
    - port: 80
      targetPort: 1411
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  namespace: pocket-id
  name: pocket-id
spec:
  parentRefs:
    - namespace: default
      name: private-gateway
      sectionName: websecure
  hostnames:
    - pocket-id.o.cavnet.cloud
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: pocket-id
          port: 80
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pocketid-superusers-binding
subjects:
  - kind: Group
    name: superusers # Pocket ID group
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
