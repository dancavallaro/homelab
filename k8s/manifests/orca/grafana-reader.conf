# Read-only gate between Orca sessions and Grafana. Grafana's datasource proxy needs only
# datasources:query, which every Viewer has, and it passes any method to Loki and Alertmanager
# and POSTs to Mimir. Directly, a Viewer could push or delete logs, silence alerts and edit
# ruler rules. Through here, only queries and GETs reach Grafana.
upstream grafana {
    server grafana.monitoring.svc.cluster.local:80;
}

server {
    listen 8080;
    client_max_body_size 64k;

    # Match on exactly what's forwarded: proxy_pass sends the raw URI, which nginx doesn't
    # normalize, so refuse any path with escapes or dot segments.
    if ($request_uri ~ "^[^?]*(%|\.\.|//)") {
        return 403;
    }

    # Sessions authenticate with X-JWT-Assertion only, never another Grafana credential.
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";

    location = /api/ds/query {
        limit_except POST { deny all; }
        proxy_pass http://grafana;
    }

    location ~ ^/api/(user|frontend/settings|search|health)$ {
        limit_except GET { deny all; }
        proxy_pass http://grafana;
    }

    location ~ ^/api/dashboards/uid/[A-Za-z0-9_-]+$ {
        limit_except GET { deny all; }
        proxy_pass http://grafana;
    }

    # Datasources' own read APIs: Loki's /loki/api/v1, Mimir's Prometheus /api/v1 and
    # Alertmanager's /api/v2. GET only, which also keeps out Loki's push and delete.
    location ~ ^/api/datasources/proxy/uid/[A-Za-z0-9_-]+/(loki/)?api/v[12]/ {
        limit_except GET { deny all; }
        proxy_pass http://grafana;
    }

    location / {
        return 403;
    }
}
