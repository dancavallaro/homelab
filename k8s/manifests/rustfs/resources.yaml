apiVersion: v1
kind: Namespace
metadata:
  name: rustfs
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rustfs-secret-config
  namespace: rustfs
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-parameter-store
  dataFrom:
    - extract:
        key: /talos-prod/rustfs-secret-config
---
# This SA is used for identity only -- tokens are minted by hand for STS against RustFS.
# Deliberately has no RBAC: RustFS authorization comes from the policy mapped to this
# SA's `sub`, not from the Kubernetes API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: admin
  namespace: rustfs
automountServiceAccountToken: false
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rustfs-console
  namespace: rustfs
spec:
  parentRefs:
    - namespace: default
      name: private-gateway
      sectionName: websecure
  hostnames:
    - rustfs.o.cavnet.cloud
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: rustfs-svc
          port: 9001
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rustfs-api
  namespace: rustfs
spec:
  parentRefs:
    - namespace: default
      name: private-gateway
      sectionName: websecure
  hostnames:
    - s4.o.cavnet.cloud
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: rustfs-svc
          port: 9000
