apiVersion: v1
kind: Namespace
metadata:
  name: rustfs
---
# RustFS data on the NAS: holds every bucket, so it's on a Retain class and
# Argo never prunes or deletes it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rustfs-data-nas
  namespace: rustfs
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: synology-iscsi-retain
  resources:
    requests:
      storage: 100Gi
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rustfs-secret-config
  namespace: rustfs
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-parameter-store
  dataFrom:
    - extract:
        key: /talos-prod/rustfs-secret-config
---
# This SA is used for identity only -- tokens are minted by hand for STS against RustFS.
# Deliberately has no RBAC: RustFS authorization comes from the policy mapped to this
# SA's `sub`, not from the Kubernetes API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: admin
  namespace: rustfs
automountServiceAccountToken: false
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rustfs-console
  namespace: rustfs
spec:
  parentRefs:
    - namespace: default
      name: private-gateway
      sectionName: websecure
  hostnames:
    - rustfs.o.cavnet.cloud
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: rustfs-svc
          port: 9001
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rustfs-api
  namespace: rustfs
spec:
  parentRefs:
    - namespace: default
      name: private-gateway
      sectionName: websecure
  hostnames:
    - s4.o.cavnet.cloud
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: rustfs-svc
          port: 9000
