apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - common.yaml
  - alertmanager.yaml
  - mimir.yaml
  - loki.yaml
  - alloy.yaml
  - grafana.yaml
  - kube-state-metrics.yaml
  - argocd-servicemonitor.yaml
  - alerts/hosts.yaml
  - alerts/kubernetes.yaml
configMapGenerator:
  - name: loki-conf
    files:
      - config.yaml=conf/loki/config.yaml
  - name: alloy-conf
    files:
      - conf/alloy/common.alloy
      - conf/alloy/cluster-events.alloy
      - conf/alloy/cluster-metrics.alloy
      - conf/alloy/rules.alloy
      - conf/alloy/app-metrics.alloy
      - conf/alloy/self-metrics.alloy
  - name: alloy-talos-conf
    files:
      - conf/alloy/common.alloy
      - conf/alloy/talos-logs.alloy
      - conf/alloy/node-metrics.alloy
      - conf/alloy/pod-logs.alloy
      - conf/alloy/self-metrics.alloy
