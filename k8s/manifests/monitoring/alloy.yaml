apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: alloy-cluster-reader
rules:
  # discovery.kubernetes (node and pod roles), loki.source.kubernetes_events
  - apiGroups: [""]
    resources: ["nodes", "pods", "events"]
    verbs: ["get", "list", "watch"]
  # kubelet cAdvisor scrape
  - apiGroups: [""]
    resources: ["nodes/metrics"]
    verbs: ["get"]
  # mimir.rules.kubernetes
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["prometheusrules"]
    verbs: ["get", "list", "watch"]
  # prometheus.operator.servicemonitors and podmonitors, plus the endpointslice discovery they run
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["servicemonitors", "podmonitors"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: alloy-cluster-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: alloy-cluster-reader
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: monitoring
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alloy
  namespace: monitoring
spec:
  replicas: 1
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: alloy
  template:
    metadata:
      labels:
        app: alloy
    spec:
      serviceAccountName: alloy
      containers:
        - name: alloy
          image: grafana/alloy:v1.22.0
          args:
            - run
            - --server.http.listen-addr=0.0.0.0:12345
            - /etc/alloy.d
          ports:
            - name: http
              containerPort: 12345
          volumeMounts:
            - name: alloy-conf
              mountPath: /etc/alloy.d
          resources:
            requests:
              cpu: 25m
              memory: 384Mi
      volumes:
        - name: alloy-conf
          configMap:
            name: alloy-conf
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: alloy-talos
  namespace: monitoring
spec:
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: alloy-talos
  template:
    metadata:
      labels:
        app: alloy-talos
    spec:
      serviceAccountName: alloy
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
        - effect: NoSchedule
          key: node-role.kubernetes.io/control-plane
          operator: Exists
      containers:
        - name: alloy
          image: grafana/alloy:v1.22.0
          securityContext:
            privileged: true
          args:
            - run
            # hostNetwork pod: keep off Cilium's Envoy proxy-port range (10000-20000)
            # to avoid colliding with a gateway L7LB listener after a node reboot.
            - --server.http.listen-addr=127.0.0.1:8012
            # Keeps loki.source.file positions across restarts, so pod logs aren't re-read.
            - --storage.path=/var/lib/alloy
            - --stability.level=experimental
            - /etc/alloy.d
          env:
            # pod-logs.alloy discovers only the pods on this node.
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: alloy-talos-conf
              mountPath: /etc/alloy.d
              readOnly: true
            - name: rootfs
              mountPath: /host/root
              mountPropagation: HostToContainer
            - name: procfs
              mountPath: /host/proc
              mountPropagation: HostToContainer
            - name: sysfs
              mountPath: /host/sys
              mountPropagation: HostToContainer
            - name: udev-data
              mountPath: /host/udev
              mountPropagation: HostToContainer
            - name: pod-logs
              mountPath: /var/log/pods
              readOnly: true
            - name: alloy-data
              mountPath: /var/lib/alloy
          resources:
            requests:
              cpu: 25m
              memory: 256Mi
      volumes:
        - name: alloy-talos-conf
          configMap:
            name: alloy-talos-conf
        - name: rootfs
          hostPath:
            path: /
            type: Directory
        - name: procfs
          hostPath:
            path: /proc
            type: Directory
        - name: sysfs
          hostPath:
            path: /sys
            type: Directory
        - name: udev-data
          hostPath:
            path: /run/udev/data
            type: Directory
        - name: pod-logs
          hostPath:
            path: /var/log/pods
            type: Directory
        - name: alloy-data
          hostPath:
            path: /var/lib/alloy
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: alloy
  namespace: monitoring
spec:
  selector:
    app: alloy
  ports:
    - port: 80
      targetPort: http
