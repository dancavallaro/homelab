apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: kubernetes
spec:
  groups:
    - name: job-alerts
      interval: 1m
      rules:
        - alert: Failed Kubernetes Job
          expr: increase(kube_job_status_failed{cluster="talos-prod"}[1h]) > 0
          annotations:
            message: "Job {{ $labels.namespace }}/{{ $labels.job_name }} has failed."
        - alert: Stuck Kubernetes Job
          expr: ((time() - kube_job_status_start_time{cluster="talos-prod"})/3600 unless kube_job_status_completion_time{cluster="talos-prod"}) > 2
          annotations:
            message: "Job {{ $labels.namespace }}/{{ $labels.job_name }} has been running for more than 2 hours."
    - name: cluster-health
      interval: 1m
      rules:
        - alert: ArgoCD Sync Disabled
          expr: kube_statefulset_status_replicas_current{cluster="talos-prod", namespace="argocd", statefulset="argocd-application-controller"} == 0
          for: 4h
          annotations:
            message: "ArgoCD application sync controller has been disabled for a while. Did you forget to re-enable it?"
        - alert: ArgoCD applications not healthy
          expr: argocd_app_info{health_status!="Healthy"}
          for: 30m
          annotations:
            message: "ArgoCD application {{ $labels.name }} has health status {{ $labels.health_status }}."
        - alert: ArgoCD application out of sync
          expr: argocd_app_info{sync_status!="Synced"}
          for: 30m
          annotations:
            message: "ArgoCD application {{ $labels.name }} has sync status {{ $labels.sync_status }}."
        - alert: Node low on memory
          expr: node_memory_MemAvailable_bytes{cluster="talos-prod"} / node_memory_MemTotal_bytes{cluster="talos-prod"} < 0.15
          for: 30m
          annotations:
            message: "{{ $labels.host }} has {{ $value | humanizePercentage }} of its memory available."
        - alert: One or more pods are unavailable
          expr:  (kube_deployment_status_replicas_unavailable > 0) or (kube_statefulset_status_replicas_ready < kube_statefulset_replicas) or (kube_daemonset_status_number_unavailable > 0)
          for: 10m
