apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loki-data
  namespace: monitoring
spec:
  storageClassName: local-path-v2
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 30Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: loki
  namespace: monitoring
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: monitoring
spec:
  replicas: 1
  revisionHistoryLimit: 0
  # Never run two Loki pods against the same data volume (WAL, index, compactor state). RWO doesn't
  # prevent that here, since both pods would land on the same node as the local-path volume.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
        k8s.spirl.com/spiffe-csi: enabled
    spec:
      serviceAccountName: loki
      containers:
        - name: loki
          image: grafana/loki:3.7.9
          args:
            - -config.file=/etc/loki/config.yaml
          env:
            - name: AWS_ROLE_ARN
              value: arn:aws:iam::000000000000:role/rustfs
            - name: AWS_WEB_IDENTITY_TOKEN_FILE
              value: /var/run/secrets/rustfs/token
          ports:
            - name: http
              containerPort: 3100
          volumeMounts:
            - name: loki-conf
              mountPath: /etc/loki
              readOnly: true
            - name: loki-data
              mountPath: /loki
              readOnly: false
            - name: rustfs-token
              mountPath: /var/run/secrets/rustfs
              readOnly: true
          resources:
            requests:
              cpu: 25m
              memory: 320Mi
        - name: spiffe-proxy
          image: ghostunnel/ghostunnel:v1.11.3-distroless
          args:
            - server
            - --listen=0.0.0.0:8443
            - --target=127.0.0.1:3100
            - --use-workload-api
            - --allow-uri=spiffe://prod.cavallaro.local/linux-servers/*/alloy
            - --allow-uri=spiffe://prod.cavallaro.local/networking-secure/*/alloy.service
            - --allow-uri=spiffe://prod.cavallaro.local/iot/*
          ports:
            - name: mtls
              containerPort: 8443
      volumes:
        - name: loki-conf
          configMap:
            name: loki-conf
            optional: false
        - name: loki-data
          persistentVolumeClaim:
            claimName: loki-data
        - name: rustfs-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: rustfs
                  expirationSeconds: 3600
                  path: token
---
apiVersion: v1
kind: Service
metadata:
  name: loki-http
  namespace: monitoring
  annotations:
    "coredns.io/hostname": loki.o.cavnet.cloud
spec:
  type: LoadBalancer
  selector:
    app: loki
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: mtls
      port: 443
      targetPort: mtls
