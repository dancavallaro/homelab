apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-conf
  namespace: monitoring
data:
  config.yaml: |-
    target: all
    auth_enabled: false
    server:
      log_level: warn
    schema_config:
      configs:
        - from: 2025-04-01
          store: tsdb
          object_store: s3
          schema: v13
          index:
            prefix: index_
            period: 24h
    common:
      ring:
        kvstore:
          store: inmemory
      replication_factor: 1
      path_prefix: /loki
      storage:
        object_store:
          s3:
            bucket_name: loki-chunks
            endpoint: rustfs-svc.rustfs:9000
            insecure: true
            region: us-east-1
            bucket_lookup_type: path
            # Credentials come from AWS_WEB_IDENTITY_TOKEN_FILE and AWS_ROLE_ARN via RustFS STS.
            sts_endpoint: http://rustfs-svc.rustfs:9000
    limits_config:
      max_query_length: 0
      # Don't enforce automatic retention (only enabled for deletion)
      retention_period: "0s"
      deletion_mode: filter-and-delete
    # Most streams are slow, so the default limits cut chunks of a few KB each. Longer chunks mean
    # far fewer objects in the bucket; the WAL keeps unflushed data across restarts.
    ingester:
      chunk_idle_period: 6h
      max_chunk_age: 12h
    querier:
      # Covers max_chunk_age plus the index upload after a flush.
      query_ingesters_within: 13h
    compactor:
      # Keep delete requests' end time at least a day in the past. WAL replay after a restart can
      # bring back references to recently flushed chunks, and queries then fail with
      # "failed to load chunk".
      retention_enabled: true
      retention_delete_delay: "1h"
      delete_request_cancel_period: "1m"
      compaction_interval: "10m"
      delete_request_store: s3
    storage_config:
      use_thanos_objstore: true
      tsdb_shipper:
        # A fresh cache, so nothing is reused from the filesystem store.
        cache_location: /loki/tsdb-shipper-cache-s3
    ruler_storage:
      backend: s3
      s3:
        bucket_name: loki-ruler
        endpoint: rustfs-svc.rustfs:9000
        insecure: true
        region: us-east-1
        bucket_lookup_type: path
        sts_endpoint: http://rustfs-svc.rustfs:9000
    ruler:
      enable_api: true
      alertmanager_url: http://alertmanager.monitoring
      # This block is ignored! The ruler_storage block above overrides this now that
      # the Thanos client is enabled, but this block needs to still exist (and be valid)
      # because of this stupid bug: https://github.com/grafana/loki/issues/16543
      storage:
        type: local
        local:
          directory: /tmp
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loki-data
  namespace: monitoring
spec:
  storageClassName: local-path-v2
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 30Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: loki
  namespace: monitoring
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: monitoring
spec:
  replicas: 1
  revisionHistoryLimit: 0
  # Never run two Loki pods against the same data volume (WAL, index, compactor state). RWO doesn't
  # prevent that here, since both pods would land on the same node as the local-path volume.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
        k8s.spirl.com/spiffe-csi: enabled
    spec:
      serviceAccountName: loki
      containers:
        - name: loki
          image: grafana/loki:3.7.9
          args:
            - -config.file=/etc/loki/config.yaml
          env:
            - name: AWS_ROLE_ARN
              value: arn:aws:iam::000000000000:role/rustfs
            - name: AWS_WEB_IDENTITY_TOKEN_FILE
              value: /var/run/secrets/rustfs/token
          ports:
            - name: http
              containerPort: 3100
          volumeMounts:
            - name: loki-conf
              mountPath: /etc/loki
              readOnly: true
            - name: loki-data
              mountPath: /loki
              readOnly: false
            - name: rustfs-token
              mountPath: /var/run/secrets/rustfs
              readOnly: true
          resources:
            requests:
              cpu: 25m
              memory: 320Mi
        - name: spiffe-proxy
          image: ghostunnel/ghostunnel:v1.11.3-distroless
          args:
            - server
            - --listen=0.0.0.0:8443
            - --target=127.0.0.1:3100
            - --use-workload-api
            - --allow-uri=spiffe://prod.cavallaro.local/linux-servers/*/alloy
            - --allow-uri=spiffe://prod.cavallaro.local/networking-secure/*/alloy.service
            - --allow-uri=spiffe://prod.cavallaro.local/iot/*
          ports:
            - name: mtls
              containerPort: 8443
      volumes:
        - name: loki-conf
          configMap:
            name: loki-conf
            optional: false
        - name: loki-data
          persistentVolumeClaim:
            claimName: loki-data
        - name: rustfs-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: rustfs
                  expirationSeconds: 3600
                  path: token
---
apiVersion: v1
kind: Service
metadata:
  name: loki-http
  namespace: monitoring
  annotations:
    "coredns.io/hostname": loki.o.cavnet.cloud
spec:
  type: LoadBalancer
  selector:
    app: loki
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: mtls
      port: 443
      targetPort: mtls
