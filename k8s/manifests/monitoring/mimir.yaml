apiVersion: v1
kind: ConfigMap
metadata:
  name: mimir-conf
  namespace: monitoring
data:
  conf.yaml: |-
    server:
      log_level: info
    target: all
    multitenancy_enabled: false
    ingester:
      ring:
        replication_factor: 1
        kvstore:
          store: inmemory
    common:
      storage:
        backend: s3
        s3:
          endpoint: rustfs-svc.rustfs:9000
          insecure: true
          region: us-east-1
          bucket_lookup_type: path
          # Credentials come from AWS_WEB_IDENTITY_TOKEN_FILE and AWS_ROLE_ARN via RustFS STS.
          sts_endpoint: http://rustfs-svc.rustfs:9000
    blocks_storage:
      s3:
        bucket_name: mimir-blocks
      tsdb:
        dir: /mimir/tsdb
      bucket_store:
        sync_dir: /mimir/tsdb-sync
    compactor:
      data_dir: /mimir/compactor
    ruler:
      alertmanager_url: http://alertmanager.monitoring
    ruler_storage:
      s3:
        bucket_name: mimir-ruler
    limits:
      cardinality_analysis_enabled: true
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mimir-data
  namespace: monitoring
spec:
  storageClassName: local-path-v2
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mimir
  namespace: monitoring
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mimir
  namespace: monitoring
spec:
  replicas: 1
  revisionHistoryLimit: 0
  # Never run two Mimir pods against the same TSDB directory on the local-path volume.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mimir
  template:
    metadata:
      labels:
        app: mimir
        k8s.spirl.com/spiffe-csi: enabled
    spec:
      serviceAccountName: mimir
      containers:
        - name: mimir
          image: grafana/mimir:2.16.0
          args:
            - -config.file=/etc/mimir/conf.yaml
          env:
            - name: AWS_ROLE_ARN
              value: arn:aws:iam::000000000000:role/rustfs
            - name: AWS_WEB_IDENTITY_TOKEN_FILE
              value: /var/run/secrets/rustfs/token
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: mimir-conf
              mountPath: /etc/mimir
              readOnly: true
            - name: mimir-data
              mountPath: /mimir
              readOnly: false
            - name: rustfs-token
              mountPath: /var/run/secrets/rustfs
              readOnly: true
          resources:
            requests:
              cpu: 25m
              memory: 320Mi
        - name: spiffe-proxy
          image: ghostunnel/ghostunnel:v1.11.3-distroless
          args:
            - server
            - --listen=0.0.0.0:8443
            - --target=127.0.0.1:8080
            - --use-workload-api
            - --allow-uri=spiffe://prod.cavallaro.local/linux-servers/*/alloy
            - --allow-uri=spiffe://prod.cavallaro.local/networking-secure/*/alloy.service
          ports:
            - name: mtls
              containerPort: 8443
      volumes:
        - name: mimir-conf
          configMap:
            name: mimir-conf
            optional: false
        - name: mimir-data
          persistentVolumeClaim:
            claimName: mimir-data
        - name: rustfs-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: rustfs
                  expirationSeconds: 3600
                  path: token
---
apiVersion: v1
kind: Service
metadata:
  name: mimir-http
  namespace: monitoring
  annotations:
    "coredns.io/hostname": mimir.o.cavnet.cloud
spec:
  type: LoadBalancer
  selector:
    app: mimir
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: mtls
      port: 443
      targetPort: mtls
