apiVersion: v1
kind: Namespace
metadata:
  name: shopping-list-sync
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  namespace: shopping-list-sync
  name: shopping-list-sync-data
spec:
  storageClassName: synology-iscsi
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
kind: Deployment
apiVersion: apps/v1
metadata:
  namespace: shopping-list-sync
  name: shopping-list-sync
spec:
  replicas: 1
  revisionHistoryLimit: 0
  # SQLite on an RWO volume cannot tolerate two pods
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: shopping-list-sync
  template:
    metadata:
      labels:
        app: shopping-list-sync
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # WAL mode creates -wal and -shm siblings, so the DIRECTORY must be
        # writable by the distroless nonroot uid, not just the database file.
        fsGroup: 65532
      containers:
        - name: shopping-list-sync
          image: ghcr.io/dancavio/shopping-list-sync/shopping-list-sync:0.1.0
          env:
            - name: DB_PATH
              value: /data/sync.sqlite
            - name: OIDC_ISSUER
              value: https://pocket-id.o.cavnet.cloud
            - name: OIDC_AUDIENCE
              value: b56da2f7-3132-4640-816a-43421262a3a3
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: shopping-list-sync-data
---
apiVersion: v1
kind: Service
metadata:
  namespace: shopping-list-sync
  name: shopping-list-sync
spec:
  selector:
    app: shopping-list-sync
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  namespace: shopping-list-sync
  name: shopping-list-sync
spec:
  parentRefs:
    - namespace: default
      name: private-gateway
      sectionName: websecure
  hostnames:
    - shopping-list.o.cavnet.cloud
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: shopping-list-sync
          port: 80
