apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: volsync
helmCharts:
  - name: volsync
    repo: https://backube.github.io/helm-charts
    releaseName: volsync
    version: 0.16.0
    namespace: volsync
    includeCRDs: true
    # The chart renders its ServiceMonitor only when this API exists. Argo CD passes the
    # cluster's API versions to Helm; listing it here makes local builds render the same thing.
    apiVersions:
      - monitoring.coreos.com/v1/ServiceMonitor
    valuesInline:
      metrics:
        disableAuth: true
resources:
  - resources.yaml
  - metrics-exporter.yaml
  - servicemonitor.yaml
  - alerts.yaml
patches:
  # The chart's ServiceMonitor scrapes every metric every 30s; keep only volsync_* at the
  # default interval. The endpoint list is replaced whole.
  - patch: |-
      apiVersion: monitoring.coreos.com/v1
      kind: ServiceMonitor
      metadata:
        name: volsync
      spec:
        endpoints:
          - port: https
            path: /metrics
            scheme: https
            tlsConfig:
              insecureSkipVerify: true
            metricRelabelings:
              - sourceLabels: [__name__]
                regex: volsync_.*
                action: keep
