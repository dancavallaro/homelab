apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kube-multus-ds
  namespace: kube-system
spec:
  template:
    spec:
      containers:
        - name: kube-multus
          # The upstream 50Mi limit OOM-kills the delegated primary CNI (multus-cni#1346).
          resources:
            requests:
              cpu: 200m
              memory: 100Mi
            limits:
              cpu: 300m
              memory: 150Mi
      initContainers:
        # Talos ships no macvlan, static or tuning plugin; install only those three.
        - name: install-reference-plugins
          image: alpine:3
          env:
            - name: CNI_PLUGINS_VERSION
              value: v1.9.1
            - name: CNI_PLUGINS_SHA256
              value: b98f74a0f8522f0a83867178729c1aa70f2158f90c45a2ca8fa791db1c76b303
          command:
            - sh
            - -euc
            - |
              tarball="cni-plugins-linux-amd64-${CNI_PLUGINS_VERSION}.tgz"
              cd /tmp
              wget -q "https://github.com/containernetworking/plugins/releases/download/${CNI_PLUGINS_VERSION}/${tarball}"
              echo "${CNI_PLUGINS_SHA256}  ${tarball}" | sha256sum -c -
              tar -xzf "${tarball}" ./macvlan ./static ./tuning
              for plugin in macvlan static tuning; do
                cp "${plugin}" "/host/opt/cni/bin/.${plugin}.new"
                mv "/host/opt/cni/bin/.${plugin}.new" "/host/opt/cni/bin/${plugin}"
              done
          securityContext:
            privileged: true
          volumeMounts:
            - name: cnibin
              mountPath: /host/opt/cni/bin
