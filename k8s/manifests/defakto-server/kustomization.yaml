apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
helmCharts:
  - name: spirl-server
    repo: oci://ghcr.io/spirl/charts
    version: 0.40.0
    # Defakto requires the release name to equal trustDomainDeployment.id.
    releaseName: &tdd tdd-h0efqszxk9
    namespace: *tdd
    includeCRDs: true
    valuesInline:
      # Adds hook/sync-wave annotations to the chart's init jobs.
      argocd:
        enabled: true
      trustDomainDeployment:
        id: *tdd
        trustDomainID: td-tn4hsa850h
        trustDomainName: prod.cavallaro.local
        name: talos-prod
        service:
          # The agent endpoint is plaintext gRPC, but Envoy defaults to HTTP/1.1 upstream.
          appProtocol: kubernetes.io/h2c
        serviceAccount:
          annotations:
            eks.amazonaws.com/role-arn: arn:aws:iam::484396241422:role/defakto-signing-role
# Applies to grpcroute.yaml and anything the chart left unqualified.
namespace: *tdd
resources:
  - grpcroute.yaml
replacements:
  # Derive the Service name from the chart's release-prefixed Deployment so the
  # trust domain deployment ID appears only once, above.
  - source:
      kind: Deployment
      fieldPath: metadata.name
    targets:
      - select:
          kind: GRPCRoute
        fieldPaths:
          - spec.rules.0.backendRefs.0.name
        options:
          delimiter: "-agent"
          index: 0
